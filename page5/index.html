<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg site-nav sticky-top">
      <div class="container">
        <a class="brand" href="../page1/index.html">
          <span class="logo-mark">&#9882;</span>
          <span><span class="brand-name">MYTHOS</span><span class="brand-sub">Creature archive</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../page1/index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../page2/index.html">Bestiary</a></li>
            <li class="nav-item"><a class="nav-link" href="../page3/index.html">Mythologies</a></li>
            <li class="nav-item"><a class="nav-link" href="../page4/index.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="../page5/index.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container contact-wrap">
    <div class="row g-5">
      <div class="col-12 col-lg-5">
        <p class="eyebrow">Contribute</p>
        <h1>Have you heard<br>a strange tale?</h1>
        <p class="mt-4">We welcome corrections, family folklore, notes and suggestions for future entries</p>
        <div class="contact-detail">
          <div><small>Editorial desk</small>team@mythos-archive.example</div>
          <div><small>Response time</small>Within 3 to 5 working days</div>
        </div>
      </div>
      <div class="col-12 col-lg-7">
        <form class="form-panel" action="#">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="name" class="form-label">Your name</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Name" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="col-12">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" name="subject" placeholder="What would you like to share?">
            </div>
            <div class="col-12">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" name="message" placeholder="Tell us more about your story..." rows="5" required></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
